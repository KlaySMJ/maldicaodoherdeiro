<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdeiro do Culto: versões</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; background: #080807; color: #eee4d6; font-family: Georgia, serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
h1 { margin: 0 0 6px; font-size: 26px; font-weight: 400; }
p { margin: 0; color: #b4aa9d; font-size: 15px; }
label { cursor: pointer; font-size: 14px; white-space: nowrap; }
main { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
figure { grid-column: span 2; margin: 0; border: 1px solid #3a342b; background: #10100e; }
figure:nth-child(4) { grid-column: 2 / span 2; }
figure:nth-child(5) { grid-column: 4 / span 2; }
a { display: block; }
img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
figcaption { display: flex; align-items: baseline; justify-content: space-between; padding: 12px; border-top: 1px solid #3a342b; font-size: 17px; gap: 10px; }
small { color: #b4aa9d; font-size: 12px; }
body.transparencia a { background-color: #555; background-image: linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
@media(max-width: 900px) { main { grid-template-columns: repeat(2,minmax(0,1fr)); } figure, figure:nth-child(4), figure:nth-child(5) { grid-column: auto; } header { align-items: start; flex-direction: column; } }
@media(max-width: 480px) { body { margin: 12px; } main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div><h1>Herdeiro do Culto</h1><p>Base aprovada, três faixas negativas e adesão ao culto. Clique em um retrato para abrir o PNG.</p></div>
  <label><input id="transparencia" type="checkbox"> Conferir transparência</label>
</header>
<main>
    <figure>
      <a href="../../assets/herdeiros/herdeiro-culto-neutra.png" target="_blank"><img src="../../assets/herdeiros/herdeiro-culto-neutra.png" alt="Herdeiro do Culto: inicial" decoding="sync"></a>
      <figcaption>Inicial<small>Base aprovada</small></figcaption>
    </figure>
    <figure>
      <a href="../../assets/herdeiros/herdeiro-culto-baixa.png" target="_blank"><img src="../../assets/herdeiros/herdeiro-culto-baixa.png" alt="Herdeiro do Culto: honra baixa" decoding="sync"></a>
      <figcaption>Honra baixa<small>−30</small></figcaption>
    </figure>
    <figure>
      <a href="../../assets/herdeiros/herdeiro-culto-baixa-2.png" target="_blank"><img src="../../assets/herdeiros/herdeiro-culto-baixa-2.png" alt="Herdeiro do Culto: honra muito baixa" decoding="sync"></a>
      <figcaption>Honra muito baixa<small>−60</small></figcaption>
    </figure>
    <figure>
      <a href="../../assets/herdeiros/herdeiro-culto-baixissima.png" target="_blank"><img src="../../assets/herdeiros/herdeiro-culto-baixissima.png" alt="Herdeiro do Culto: honra mínima" decoding="sync"></a>
      <figcaption>Honra mínima<small>−90</small></figcaption>
    </figure>
    <figure>
      <a href="../../assets/herdeiros/herdeiro-culto-culto.png" target="_blank"><img src="../../assets/herdeiros/herdeiro-culto-culto.png" alt="Herdeiro do Culto: adesão ao culto" decoding="sync"></a>
      <figcaption>Adesão ao culto<small>Corrupção e fanatismo</small></figcaption>
    </figure>
</main>
<script>document.getElementById("transparencia").addEventListener("change", (event) => document.body.classList.toggle("transparencia", event.target.checked));</script>
</body>
</html>
