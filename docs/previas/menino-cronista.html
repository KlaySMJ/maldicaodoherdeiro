<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menino da Crônica: versões</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; background: #080807; color: #eee4d6; font-family: Georgia, serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
h1 { margin: 0 0 6px; font-size: 26px; font-weight: 400; }
p { margin: 0; color: #b4aa9d; font-size: 15px; }
label { cursor: pointer; font-size: 14px; white-space: nowrap; }
main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
figure { margin: 0; border: 1px solid #3a342b; background: #10100e; }
a { display: block; }
img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
figcaption { display: flex; align-items: baseline; justify-content: space-between; padding: 12px; border-top: 1px solid #3a342b; font-size: 17px; gap: 10px; }
small { color: #b4aa9d; font-size: 12px; }
body.transparencia a { background-color: #555; background-image: linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
@media(max-width: 900px) { main { grid-template-columns: repeat(2,minmax(0,1fr)); } header { align-items: start; flex-direction: column; } }
@media(max-width: 480px) { body { margin: 12px; } main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div><h1>Menino da Crônica</h1><p>Túnica e gola alta em laranja queimado; capa marfim. As honras negativas desbotam sem perder o tom quente. O culto permanece intacto.</p></div>
  <label><input id="transparencia" type="checkbox"> Conferir transparência</label>
</header>
<main>
  <figure><a href="../../assets/herdeiros/menino-cronista-neutra.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-neutra.png" alt="Menino da Crônica: neutra" decoding="sync"></a><figcaption>Neutra<small>#B9753F</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-alta.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-alta.png" alt="Menino da Crônica: honra alta" decoding="sync"></a><figcaption>Honra alta<small>+30 · #B9753F</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-alta-2.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-alta-2.png" alt="Menino da Crônica: honra muito alta" decoding="sync"></a><figcaption>Honra muito alta<small>+60 · #B9753F</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-altissima.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-altissima.png" alt="Menino da Crônica: honra máxima" decoding="sync"></a><figcaption>Honra máxima<small>+90 · #B9753F</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-baixa.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-baixa.png" alt="Menino da Crônica: honra baixa" decoding="sync"></a><figcaption>Honra baixa<small>-30 · #C38A5E</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-baixa-2.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-baixa-2.png" alt="Menino da Crônica: honra muito baixa" decoding="sync"></a><figcaption>Honra muito baixa<small>-60 · #CEA17E</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-baixissima.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-baixissima.png" alt="Menino da Crônica: honra baixíssima" decoding="sync"></a><figcaption>Honra baixíssima<small>-90 · #D3AE91</small></figcaption></figure>
  <figure><a href="../../assets/herdeiros/menino-cronista-culto.png" target="_blank" rel="noopener"><img src="../../assets/herdeiros/menino-cronista-culto.png" alt="Menino da Crônica: culto" decoding="sync"></a><figcaption>Culto<small>Inalterado</small></figcaption></figure>
</main>
<script>document.getElementById("transparencia").addEventListener("change", (event) => document.body.classList.toggle("transparencia", event.target.checked));</script>
</body>
</html>
