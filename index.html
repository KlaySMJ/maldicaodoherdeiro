<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0908">
  <meta name="description" content="Cada herdeiro faz suas escolhas. O povo lembra. Um jogo de fantasia medieval para o navegador.">
  <title>A maldição do Herdeiro</title>
  <link rel="icon" href="assets/selo.svg" type="image/svg+xml">
  <!-- A escrita durante o parsing preserva defer e a ordem de execução em file://. -->
  <script>
    (() => {
      const VERSAO_ASSETS = "20261112-76";
      window.JOGO_VERSAO_ASSETS = VERSAO_ASSETS;
      const mostrarErroDeAbertura = () => {
        const app = document.getElementById("app");
        if (!app || document.body?.dataset.tela) return;
        if (!app.querySelector(".carregando") && app.childElementCount > 0) return;
        app.innerHTML = `<section class="erro-inicializacao" role="alert"><h1>A crônica não abriu</h1><p>Um recurso falhou ao carregar. Tente abrir a página outra vez.</p><a class="botao primario" href="index.html">Tentar novamente</a></section>`;
      };
      window.addEventListener("error", (evento) => {
        if (evento instanceof ErrorEvent || evento.target?.tagName === "SCRIPT") mostrarErroDeAbertura();
      }, true);
      window.addEventListener("unhandledrejection", mostrarErroDeAbertura);
      document.write(`<link rel="stylesheet" href="css/style.css?v=${VERSAO_ASSETS}">`);
      document.write(`<link rel="stylesheet" href="css/interface.css?v=${VERSAO_ASSETS}">`);
      document.write(`<link rel="stylesheet" href="css/mapa-vila.css?v=${VERSAO_ASSETS}">`);
      const arquivos = [
        "js/state.js",
        "js/herdeiros.js",
        "js/events.js",
        "js/events-vila.js",
        "js/events-pactos.js",
        "js/events-abissais.js",
        "js/events-baus.js",
        "js/events-personagens-cadeias.js",
        "js/events-conselheiro.js",
        "js/events-recompensas.js",
        "js/events-specials.js",
        "js/events-lethal.js",
        "js/events-cult.js",
        "js/events-foundations.js",
        "js/events-entity.js",
        "js/events-bosses.js",
        "js/events-supernatural.js",
        "js/events-grail.js",
        "js/events-druida.js",
        "js/events-anuais.js",
        "js/events-personagens.js",
        "js/events-artes-especificas.js",
        "js/events-heroi.js",
        "js/events-ajustes.js",
        "js/events-progresso.js",
        "js/events-propostas.js",
        "js/events-d20.js",
        "js/items.js",
        "js/legacy.js",
        "js/conquistas.js",
        "js/druida.js",
        "js/sistemas.js",
        "js/engine.js",
        "js/pressagios.js",
        "js/save.js",
        "js/audio.js",
        "js/ui.js",
        "js/sistemas-ui.js",
        "js/main.js"
      ];
      document.write(arquivos.map(arquivo =>
        `<script defer src="${arquivo}?v=${VERSAO_ASSETS}"><\/script>`
      ).join("\n"));
    })();
  </script>
</head>
<body>
  <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <filter id="tom-vila-evento" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="1.03 0 0 0 0 0 0.97 0 0 0 0 0 0.87 0 0 0 0 0 1 0" />
      </filter>
    </defs>
  </svg>
  <div class="livro">
    <header class="cabecalho">
      <a class="marca" href="index.html" aria-label="A maldição do Herdeiro — início"><img src="assets/selo.svg" width="32" height="36" alt="">A maldição do Herdeiro</a>
      <button id="alternar-texto-automatico" class="controle-texto" type="button" aria-pressed="true">Texto automático: ativo</button>
      <details id="controles-audio" class="menu-audio">
        <summary class="controle-audio" aria-label="Abrir controles de música" title="Controles de música">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </summary>
        <div class="painel-audio">
          <button id="alternar-musica" class="botao" type="button" aria-pressed="true">Pausar música</button>
          <label class="rotulo-volume" for="volume-musica"><span>Volume da música</span><output id="volume-musica-valor" for="volume-musica">50%</output></label>
          <input id="volume-musica" type="range" min="0" max="100" step="1" value="50">
          <label class="rotulo-volume" for="volume-efeitos"><span>Volume dos efeitos</span><output id="volume-efeitos-valor" for="volume-efeitos">65%</output></label>
          <input id="volume-efeitos" type="range" min="0" max="100" step="1" value="65">
        </div>
      </details>
    </header>
    <main id="app" tabindex="-1"><p class="carregando">Abrindo as crônicas…</p></main>
    <noscript>Ative o JavaScript do navegador para jogar.</noscript>
  </div>
  <p id="aviso-save" class="aviso-save" role="status" hidden></p>
  <div class="notificacoes-conquistas" data-notificacoes-conquistas role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
